<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IVX 100 Programs Benchmark</title>
  <style>
    *, :before, :after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: #2a2a40;
      --accent: #00e5a0;
      --accent2: #4a7fff;
      --warn: #f0a030;
      --danger: #e05050;
      --text: #e8e8f0;
      --muted: #6b6b90;
      --good: #00e5a0;
      --ok: #4a7fff;
      --bad: #e05050;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }
    
    #app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }
    
    header {
      margin-bottom: 2.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
    }
    
    h1 {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    
    h1 span {
      color: var(--accent);
      font-weight: 500;
    }
    
    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.4rem;
      font-family: 'IBM Plex Mono', monospace;
    }
    
    #controls {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    button {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.5rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      letter-spacing: 0.05em;
      transition: all 0.15s;
    }
    
    button:hover:not(:disabled) {
      background: var(--accent);
      color: var(--bg);
    }
    
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    
    button.secondary {
      border-color: var(--border);
      color: var(--muted);
    }
    
    button.secondary:hover:not(:disabled) {
      background: var(--surface2);
      color: var(--text);
    }
    
    #progress-wrap {
      display: none;
      margin-bottom: 2rem;
    }
    
    .prog-label {
      font-size: 0.75rem;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }
    
    .prog-bar-bg {
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    
    .prog-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }
    
    .prog-status {
      font-size: 0.72rem;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      margin-top: 0.4rem;
      min-height: 1em;
    }
    
    #summary {
      display: none;
      margin-bottom: 2.5rem;
    }
    
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.2rem;
    }
    
    .stat-label {
      font-size: 0.72rem;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
    }
    
    .stat-val {
      font-size: 1.8rem;
      font-weight: 500;
      font-family: 'IBM Plex Mono', monospace;
    }
    
    .stat-val.good { color: var(--good); }
    .stat-val.ok { color: var(--ok); }
    .stat-val.warn { color: var(--warn); }
    
    .stat-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    
    .verdict-bar {
      display: flex;
      gap: 0;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    
    .verdict-seg {
      height: 100%;
      transition: width 0.5s;
    }
    
    #filters {
      display: none;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    
    .filter-btn {
      font-size: 0.72rem;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
    }
    
    .filter-btn.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }
    
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    
    .card:hover {
      border-color: var(--muted);
    }
    
    .card.expanded {
      border-color: var(--accent);
    }
    
    .card-header {
      padding: 0.8rem 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
    }
    
    .card-num {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      flex-shrink: 0;
      padding-top: 1px;
    }
    
    .card-title {
      font-size: 0.85rem;
      font-weight: 400;
      flex: 1;
      line-height: 1.4;
    }
    
    .card-badge {
      flex-shrink: 0;
      font-size: 0.65rem;
      font-family: 'IBM Plex Mono', monospace;
      padding: 0.2rem 0.5rem;
      border-radius: 3px;
      font-weight: 500;
    }
    
    .badge-great {
      background: rgba(0,229,160,0.15);
      color: var(--good);
      border: 1px solid rgba(0,229,160,0.3);
    }
    
    .badge-good {
      background: rgba(74,127,255,0.15);
      color: var(--ok);
      border: 1px solid rgba(74,127,255,0.3);
    }
    
    .badge-partial {
      background: rgba(240,160,48,0.15);
      color: var(--warn);
      border: 1px solid rgba(240,160,48,0.3);
    }
    
    .badge-limited {
      background: rgba(224,80,80,0.15);
      color: var(--bad);
      border: 1px solid rgba(224,80,80,0.3);
    }
    
    .card-meta {
      padding: 0 1rem 0.8rem;
      display: flex;
      gap: 1rem;
    }
    
    .meta-item {
      font-size: 0.7rem;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
    }
    
    .meta-item span {
      color: var(--text);
    }
    
    .card-body {
      display: none;
      padding: 0 1rem 1rem;
      border-top: 1px solid var(--border);
    }
    
    .card.expanded .card-body {
      display: block;
    }
    
    .section-label {
      font-size: 0.68rem;
      font-family: 'IBM Plex Mono', monospace;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 0.8rem 0 0.4rem;
    }
    
    pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.7rem 0.9rem;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre;
      color: #c0c0d8;
      max-height: 260px;
      overflow-y: auto;
    }
    
    .analysis {
      font-size: 0.78rem;
      line-height: 1.6;
      color: var(--muted);
    }
    
    .analysis strong {
      color: var(--text);
      font-weight: 400;
    }
    
    .loading-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.8rem 1rem;
      opacity: 0.5;
    }
    
    .loading-pulse {
      height: 0.8rem;
      background: var(--border);
      border-radius: 2px;
      animation: pulse 1.2s ease-in-out infinite;
    }
    
    .loading-pulse.w60 { width: 60%; }
    .loading-pulse.w40 { width: 40%; margin-top: 0.5rem; height: 0.6rem; }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }
    
    #error-msg {
      display: none;
      background: rgba(224,80,80,0.1);
      border: 1px solid rgba(224,80,80,0.3);
      border-radius: 6px;
      padding: 1rem;
      font-size: 0.8rem;
      color: var(--bad);
      margin-bottom: 1rem;
    }
    
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>IVX <span>100 Programs</span></h1>
      <div class="subtitle">
        real IVX code for 100 benchmark programs — handwritten, not generated
      </div>
    </header>
    
    <div id="controls">
      <button id="runBtn" onclick="runBenchmark()">
        show all 100
      </button>
      <button class="secondary" id="exportBtn" onclick="exportResults()" style="display:none">
        export JSON
      </button>
    </div>
    
    <div id="error-msg"></div>
    
    <div id="progress-wrap">
      <div class="prog-label">
        <span id="prog-text">loading programs...</span>
        <span id="prog-count">0 / 100</span>
      </div>
      <div class="prog-bar-bg">
        <div class="prog-bar" id="prog-bar"></div>
      </div>
      <div class="prog-status" id="prog-status"></div>
    </div>
    
    <div id="summary"></div>
    
    <div id="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">all 100</button>
      <button class="filter-btn" onclick="setFilter('great',this)">great fit</button>
      <button class="filter-btn" onclick="setFilter('good',this)">good fit</button>
      <button class="filter-btn" onclick="setFilter('partial',this)">partial fit</button>
      <button class="filter-btn" onclick="setFilter('limited',this)">limited fit</button>
    </div>
    
    <div id="grid"></div>
  </div>
  
  <script>
    const PROGRAMS = [
      // ── Automation & scripting ──────────────────────────────────────────
      {
        name: "Send a daily email digest from a Google Sheet",
        verdict: "great",
        reviewreduction: 72,
        savings: { python: 70, javascript: 65, typescript: 60, java: 75 },
        analysis: "IVX was built for exactly this: reading a sheet, looping rows, and firing emails — all in native keywords with zero boilerplate.",
        caveats: null,
        ivxcode: `wait every time "08:00"
  make s sheets "Tasks"
  make rows s.read("A1:B50")
  make body ""
  for rows
    make body "{body}- {i[0]}: {i[1]}\n"
  email "you@example.com" subject "Daily digest" body body`
      },
      {
        name: "Read CSV and filter rows by condition",
        verdict: "great",
        reviewreduction: 65,
        savings: { python: 62, javascript: 58, typescript: 54, java: 70 },
        analysis: "take file.csv hands you a list of dicts, where() filters it, and for iterates — three lines of real logic.",
        caveats: null,
        ivxcode: `take file.csv
make filtered where(file, "status", "=", "active")
for row in filtered
  say "{row["name"]} — {row["email"]}"`
      },
      {
        name: "Merge two spreadsheets by a shared key",
        verdict: "great",
        reviewreduction: 68,
        savings: { python: 65, javascript: 60, typescript: 55, java: 72 },
        analysis: "join() is a first-class table builtin. Open two sheets, read ranges, join on key — done in five lines.",
        caveats: null,
        ivxcode: `make s1 sheets "Customers"
make s2 sheets "Orders"
make customers s1.read("A1:C200")
make orders s2.read("A1:D500")
make merged join(customers, orders, "id", "customer_id")
for row in merged
  say "{row["name"]}: {row["total"]}"`
      },
      {
        name: "Watch a sheet for new rows and send welcome email",
        verdict: "great",
        reviewreduction: 75,
        savings: { python: 72, javascript: 68, typescript: 63, java: 78 },
        analysis: "wait sheets with by 'row added' is a first-class trigger. No polling logic, no webhooks — IVX deploys it to Apps Script automatically.",
        caveats: null,
        ivxcode: `wait every sheets "Signups" by "row added"
  make name request[0][0]
  make addr request[0][1]
  email addr subject "Welcome, {name}!" body "Thanks for signing up."`
      },
      {
        name: "Schedule a weekly report email",
        verdict: "great",
        reviewreduction: 70,
        savings: { python: 68, javascript: 63, typescript: 58, java: 74 },
        analysis: "wait every time with a recurring schedule deploys automatically. The entire automation is the program — no cron, no server.",
        caveats: null,
        ivxcode: `wait every time "09:00"
  make s sheets "Sales"
  make data s.read("A1:E100")
  make total 0
  for row in data
    make total total + int(row[4])
  email "boss@example.com" subject "Weekly sales report" body "Total this week: {total}"`
      },
      {
        name: "Rename and batch-process a list of file records",
        verdict: "good",
        reviewreduction: 48,
        savings: { python: 45, javascript: 40, typescript: 36, java: 52 },
        analysis: "IVX handles the data transformation naturally. Actual filesystem renaming isn't native, but the record manipulation and output is clean.",
        caveats: "No direct filesystem access — output records to Drive or a sheet instead.",
        ivxcode: `make s sheets "Files"
make files s.read("A1:B100")
for file in files
  make oldname file[0]
  make newname lower(replace(oldname, " ", "_"))
  say "Rename: {oldname} → {newname}"
  s.append([oldname, newname, "done"])`
      },
      {
        name: "Poll an API every hour and log results",
        verdict: "great",
        reviewreduction: 67,
        savings: { python: 65, javascript: 60, typescript: 55, java: 70 },
        analysis: "wait every time gives you the recurring trigger; the URL auto-fetches; sheets.append logs it. Zero infrastructure.",
        caveats: null,
        ivxcode: `make s sheets "API Log"
wait every time "00:00"
  make data "https://api.example.com/status"
  make ts time()
  s.append([ts, data["status"], data["value"]])`
      },
      {
        name: "Auto-reply to emails from a specific sender",
        verdict: "great",
        reviewreduction: 73,
        savings: { python: 70, javascript: 66, typescript: 61, java: 76 },
        analysis: "wait email by address is purpose-built for this. The trigger fires, request has the message, email sends the reply.",
        caveats: null,
        ivxcode: `wait every email by "client@example.com"
  make subject request["subject"]
  make reply "Thanks for your message about: {subject}. We'll respond within 24 hours."
  email "client@example.com" subject "Re: {subject}" body reply`
      },
      {
        name: "Sync data between two sheets",
        verdict: "great",
        reviewreduction: 69,
        savings: { python: 66, javascript: 62, typescript: 57, java: 72 },
        analysis: "Read one sheet, write to another. IVX's sheets keyword makes both feel like local operations.",
        caveats: null,
        ivxcode: `make src sheets "Source"
make dst sheets "Destination"
make data src.read("A1:Z500")
for row in data
  dst.append(row)
say "Synced {size(data)} rows"`
      },
      {
        name: "Clean and deduplicate a contact list",
        verdict: "great",
        reviewreduction: 62,
        savings: { python: 58, javascript: 54, typescript: 50, java: 65 },
        analysis: "IVX's table builtins — unique(), lower(), trim() — make contact cleaning a pipeline, not a script.",
        caveats: null,
        ivxcode: `take file.csv
make cleaned []
for contact in file
  make email lower(trim(contact["email"]))
  make name trim(contact["name"])
  push(cleaned, {"name": name, "email": email})
make deduped unique(cleaned)
say "Cleaned: {size(deduped)} contacts"
local save deduped contacts_clean.csv`
      },

      // ── Data processing ─────────────────────────────────────────────────
      {
        name: "FizzBuzz",
        verdict: "great",
        reviewreduction: 60,
        savings: { python: 55, javascript: 50, typescript: 46, java: 65 },
        analysis: "The classic benchmark. IVX's implicit subject in conditions (and % 5 = 0) makes it genuinely shorter than Python.",
        caveats: null,
        ivxcode: `loop n? < 100
  make n + 1
  if n % 15 = 0 then say "FizzBuzz"
  else if n % 3 = 0 then say "Fizz"
  else if n % 5 = 0 then say "Buzz"
  else say n`
      },
      {
        name: "Fibonacci sequence",
        verdict: "good",
        reviewreduction: 52,
        savings: { python: 48, javascript: 44, typescript: 40, java: 58 },
        analysis: "Lazy declaration with ? makes the setup line disappear. The loop body is pure math.",
        caveats: null,
        ivxcode: `make limit 20
make a 0
make b 1
loop n? < limit
  say a
  make temp b
  make b a + b
  make a temp
  make n + 1`
      },
      {
        name: "Prime number sieve",
        verdict: "good",
        reviewreduction: 45,
        savings: { python: 42, javascript: 38, typescript: 34, java: 50 },
        analysis: "Nested loops with IVX's implicit subject shorten the inner condition. The sieve logic maps cleanly.",
        caveats: null,
        ivxcode: `make limit 100
make sieve []
loop i? < limit
  make i + 1
  push(sieve, yes)
make i 2
loop i <= limit
  if sieve[i - 2]
    make j i * 2
    loop j <= limit
      make sieve[j - 2] no
      make j + i
  make i + 1
  say i`
      },
      {
        name: "Calculate compound interest",
        verdict: "great",
        reviewreduction: 58,
        savings: { python: 54, javascript: 50, typescript: 46, java: 62 },
        analysis: "A pure math formula. IVX expresses it in three lines with no ceremony.",
        caveats: null,
        ivxcode: `take flt(principal)
take flt(rate)
take int(years)
make amount principal * (1 + rate / 100) ^ years
say "Principal: {principal}"
say "After {years} years at {rate}%: {amount}"`
      },
      {
        name: "Compute a running average",
        verdict: "great",
        reviewreduction: 60,
        savings: { python: 56, javascript: 52, typescript: 48, java: 64 },
        analysis: "Lazy declaration handles the accumulator. The loop is four lines of obvious logic.",
        caveats: null,
        ivxcode: `make nums [4, 7, 2, 9, 1, 5, 8, 3, 6]
make total 0
for num in nums
  make total total + num
  make avg total / ii + 1
  say "After {ii + 1} values: avg = {avg}"`
      },
      {
        name: "Find duplicates in a list",
        verdict: "great",
        reviewreduction: 62,
        savings: { python: 58, javascript: 54, typescript: 50, java: 66 },
        analysis: "unique() and size() make this a comparison, not a loop. One of IVX's strongest moments.",
        caveats: null,
        ivxcode: `make nums [3, 1, 4, 1, 5, 9, 2, 6, 5, 3]
make seen []
make dupes []
for n in nums
  if n in seen then push(dupes, n)
  else push(seen, n)
make dupes unique(dupes)
say "Duplicates: {dupes}"`
      },
      {
        name: "Count word frequencies in text",
        verdict: "good",
        reviewreduction: 50,
        savings: { python: 46, javascript: 42, typescript: 38, java: 55 },
        analysis: "split() and a dict accumulator are natural. The loop is clean.",
        caveats: null,
        ivxcode: `take text
make words split(lower(text), " ")
make freq {}
for word in words
  make word trim(word)
  if word in freq
    make freq[word] freq[word] + 1
  else
    make freq[word] 1
say freq`
      },
      {
        name: "Sort a list of dicts by multiple keys",
        verdict: "good",
        reviewreduction: 48,
        savings: { python: 44, javascript: 40, typescript: 36, java: 52 },
        analysis: "order() handles single-key sort natively. Multi-key requires a custom sort function, which IVX supports.",
        caveats: null,
        ivxcode: `make people [
  {"name": "Alice", "age": 30, "city": "NY"},
  {"name": "Bob", "age": 25, "city": "LA"},
  {"name": "Carol", "age": 30, "city": "NY"}
]
fun sortKey(a, b)
  if a["city"] != b["city"] then give a["city"] > b["city"]
  give a["age"] > b["age"]
make sorted sort(people, sortKey)
for person in sorted
  say "{person["name"]} — {person["city"]}, {person["age"]}"`
      },
      {
        name: "Group and aggregate sales data",
        verdict: "great",
        reviewreduction: 68,
        savings: { python: 64, javascript: 60, typescript: 56, java: 72 },
        analysis: "group() and agg() are first-class table operations. This is a two-liner in IVX.",
        caveats: null,
        ivxcode: `take file.csv
make grouped group(file, "region")
make totals agg(grouped, "revenue", "sum", "total")
for row in totals
  say "{row["region"]}: {row["total"]}"`
      },
      {
        name: "Pivot a table by column value",
        verdict: "good",
        reviewreduction: 45,
        savings: { python: 42, javascript: 38, typescript: 34, java: 50 },
        analysis: "group() gets you partway there. Full pivot requires building a dict of dicts in a loop.",
        caveats: "IVX doesn't have a dedicated pivot() builtin yet — group() + manual aggregation covers most cases.",
        ivxcode: `take file.csv
make grouped group(file, "product")
make pivot {}
for g in grouped
  make product g["key"]["product"]
  make total 0
  for row in g["rows"]
    make total total + flt(row["sales"])
  make pivot[product] total
say pivot`
      },

      // ── Algorithms ──────────────────────────────────────────────────────
      {
        name: "Binary search",
        verdict: "good",
        reviewreduction: 44,
        savings: { python: 40, javascript: 36, typescript: 32, java: 48 },
        analysis: "IVX handles the loop and index arithmetic cleanly. The logic is readable.",
        caveats: null,
        ivxcode: `fun binarySearch(list, target)
  make lo 0
  make hi size(list) - 1
  loop lo <= hi
    make mid (lo + hi) // 2
    if list[mid] = target then give mid
    else if list[mid] < target then make lo mid + 1
    else make hi mid - 1
  give -1

make nums [1, 3, 5, 7, 9, 11, 13, 15]
take int(target)
make idx binarySearch(nums, target)
if idx >= 0 then say "Found at index {idx}"
else say "Not found"`
      },
      {
        name: "Bubble sort",
        verdict: "partial",
        reviewreduction: 32,
        savings: { python: 28, javascript: 25, typescript: 22, java: 36 },
        analysis: "Nested loops work, but IVX's sort() builtin makes hand-rolling bubble sort feel redundant. Good for demonstration.",
        caveats: "sort() is faster and cleaner for real use.",
        ivxcode: `fun bubbleSort(arr)
  make n size(arr)
  loop i? < n - 1
    make j 0

        analysis: "A list of bracket thresholds and a loop. Clean.",
        caveats: null,
        ivxcode: `make brackets [
  [10275, 0.10],
  [41775, 0.12],
  [89075, 0.22],
  [170050, 0.24],
  [215950, 0.32],
  [539900, 0.35],
  [999999999, 0.37]
]
take flt(income)
make tax 0
make prev 0
for bracket in brackets
  make limit bracket[0]
  make rate bracket[1]
  if income <= limit
    make tax tax + (income - prev) * rate
    end say "Income: {income}, Tax: {round(tax)}, Effective rate: {round(tax/income*100)}%"
  make tax tax + (limit - prev) * rate
  make prev limit`
      },
      {
        name: "Password strength checker",
        verdict: "great",
        reviewreduction: 62,
        savings: { python: 58, javascript: 54, typescript: 50, java: 66 },
        analysis: "match() calls and size checks. Very readable.",
        caveats: null,
        ivxcode: `take password
make score 0
make feedback []
if size(password) >= 8
  make score + 1
else
  push(feedback, "Use at least 8 characters")
if match(password, "[A-Z]") then make score + 1
else push(feedback, "Add uppercase letters")
if match(password, "[a-z]") then make score + 1
else push(feedback, "Add lowercase letters")
if match(password, "[0-9]") then make score + 1
else push(feedback, "Add numbers")
if match(password, "[^a-zA-Z0-9]") then make score + 1
else push(feedback, "Add special characters")
make strength ["Weak","Fair","Good","Strong","Very Strong"][score - 1]
say "Strength: {strength}"
for tip in feedback then say "  → {tip}"`
      },
      {
        name: "To-do list (add/complete/delete)",
        verdict: "great",
        reviewreduction: 64,
        savings: { python: 60, javascript: 56, typescript: 52, java: 68 },
        analysis: "A list of dicts, a command loop, string matching. All native IVX.",
        caveats: null,
        ivxcode: `make todos []
make nextId 1
loop yes
  say "Commands: add, complete, delete, list, quit"
  take cmd
  if cmd = "quit" then end
  if cmd = "add"
    take task
    push(todos, {"id": nextId, "task": task, "done": no})
    make nextId + 1
  else if cmd = "complete"
    take int(id)
    for todo in todos
      if todo["id"] = id then make todo["done"] yes
  else if cmd = "delete"
    take int(id)
    make todos filter(todos, fun(t) then give t["id"] != id)
  else if cmd = "list"
    for todo in todos
      make mark "[ ]"
      if todo["done"] then make mark "[x]"
      say "{mark} {todo["id"]}. {todo["task"]}"`
      },
      {
        name: "Budget tracker (income/expense/balance)",
        verdict: "great",
        reviewreduction: 65,
        savings: { python: 61, javascript: 57, typescript: 53, java: 69 },
        analysis: "A running balance, a transaction list, string matching on type. Very natural.",
        caveats: null,
        ivxcode: `make transactions []
make balance 0
loop yes
  say "Balance: {balance} | Commands: income, expense, history, quit"
  take cmd
  if cmd = "quit" then end
  if cmd = "income" or cmd = "expense"
    take flt(amount)
    take desc
    if cmd = "income"
      make balance + amount
      push(transactions, {"+": amount, "desc": desc})
    else
      make balance - amount
      push(transactions, {"-": amount, "desc": desc})
  else if cmd = "history"
    for t in transactions
      if "+" in t then say "+ {t["+"]}: {t["desc"]}"
      else say "- {t["-"]}: {t["desc"]}"`
      },
      {
        name: "Grade calculator with letter grades",
        verdict: "great",
        reviewreduction: 66,
        savings: { python: 62, javascript: 58, typescript: 54, java: 70 },
        analysis: "Average from a list, then a chain of if/else for letter grade. Six lines.",
        caveats: null,
        ivxcode: `make grades [85, 92, 78, 96, 88, 73, 91]
make avg reduce(grades, fun(a, b) then give a + b, 0) / size(grades)
make letter "F"
if avg >= 90 then make letter "A"
else if avg >= 80 then make letter "B"
else if avg >= 70 then make letter "C"
else if avg >= 60 then make letter "D"
say "Average: {round(avg)}% — Grade: {letter}"`
      },
      {
        name: "Celsius to Fahrenheit table",
        verdict: "great",
        reviewreduction: 68,
        savings: { python: 63, javascript: 59, typescript: 55, java: 70 },
        analysis: "A loop with inline arithmetic and string interpolation. Canonical IVX.",
        caveats: null,
        ivxcode: `say "°C\t°F"
say "─────────"
loop c? <= 100
  make f c * 9 / 5 + 32
  say "{c}°C\t{f}°F"
  make c + 10`
      },
      {
        name: "Countdown to a future date",
        verdict: "great",
        reviewreduction: 67,
        savings: { python: 63, javascript: 59, typescript: 55, java: 70 },
        analysis: "datediff() is a native builtin. now() gives today. Done in three lines.",
        caveats: null,
        ivxcode: `take targetDate  note format: YYYY-MM-DD
make today now()
make days datediff(today, targetDate, "days")
make hours datediff(today, targetDate, "hours")
if days > 0
  say "{days} days ({hours} hours) until {targetDate}"
else if days = 0
  say "Today is the day!"
else
  say "{targetDate} was {abs(days)} days ago"`
      }
    ];

    let results = [];
    let currentFilter = "all";

    function verdictClass(v) {
      return v === "great" ? "badge-great" :
             v === "good" ? "badge-good" :
             v === "partial" ? "badge-partial" : "badge-limited";
    }

    function verdictLabel(v) {
      return v === "great" ? "great fit" :
             v === "good" ? "good fit" :
             v === "partial" ? "partial fit" : "limited fit";
    }

    function setFilter(f, btn) {
      currentFilter = f;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderGrid();
    }

    function setProgress(done, total, status) {
      document.getElementById("prog-bar").style.width = `${(done / total) * 100}%`;
      document.getElementById("prog-count").textContent = `${done} / ${total}`;
      if (status) document.getElementById("prog-status").textContent = status;
    }

    function renderGrid() {
      const grid = document.getElementById("grid");
      const filtered = currentFilter === "all" ? results : results.filter(r => r.verdict === currentFilter);

      grid.innerHTML = filtered.map((r, i) => {
        const globalIdx = results.indexOf(r);
        const bestSaving = Math.max(r.savings.python, r.savings.javascript, r.savings.typescript, r.savings.java);
        const escapedCode = r.ivxcode.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        return `
          <div class="card" id="card-${globalIdx}" onclick="toggleCard(${globalIdx})">
            <div class="card-header">
              <span class="card-num">${String(globalIdx + 1).padStart(3, "0")}</span>
              <span class="card-title">${r.name}</span>
              <span class="card-badge ${verdictClass(r.verdict)}">${verdictLabel(r.verdict)}</span>
            </div>
            <div class="card-meta">
              <span class="meta-item">lines <span>${r.ivxcode.split('\n').filter(l => l.trim()).length}</span></span>
              <span class="meta-item">saves <span>${bestSaving}%</span> best</span>
              <span class="meta-item">review <span>${r.reviewreduction}%</span> less</span>
            </div>
            <div class="card-body">
              <div class="section-label">IVX program</div>
              <pre>${escapedCode}</pre>
              <div class="section-label">analysis</div>
              <div class="analysis">${r.analysis}</div>
              ${r.caveats ? `<div class="section-label">caveats</div><div class="analysis" style="color:var(--warn)">${r.caveats}</div>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    function toggleCard(i) {
      const card = document.getElementById(`card-${i}`);
      if (card) card.classList.toggle("expanded");
    }

    function updateSummary() {
      const counts = { great: 0, good: 0, partial: 0, limited: 0 };
      let totalReview = 0, totalLines = 0;
      results.forEach(r => {
        counts[r.verdict]++;
        totalReview += r.reviewreduction;
        totalLines += r.ivxcode.split('\n').filter(l => l.trim()).length;
      });

      const n = results.length || 1;
      const avgReview = Math.round(totalReview / n);
      const avgLines = Math.round(totalLines / n);
      const goodPct = Math.round(((counts.great + counts.good) / n) * 100);
      const gW = ((counts.great / n) * 100).toFixed(1);
      const goW = ((counts.good / n) * 100).toFixed(1);
      const pW = ((counts.partial / n) * 100).toFixed(1);
      const lW = ((counts.limited / n) * 100).toFixed(1);

      document.getElementById("summary").style.display = "block";
      document.getElementById("summary").innerHTML = `
        <div class="summary-grid">
          <div class="stat-card">
            <div class="stat-label">programs written</div>
            <div class="stat-val ok">${results.length}</div>
            <div class="stat-sub">all handwritten IVX</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">great or good fit</div>
            <div class="stat-val good">${goodPct}%</div>
            <div class="stat-sub">${counts.great} great, ${counts.good} good</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">avg review reduction</div>
            <div class="stat-val good">${avgReview}%</div>
            <div class="stat-sub">vs Python baseline</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">avg IVX lines</div>
            <div class="stat-val ok">${avgLines}</div>
            <div class="stat-sub">non-blank lines</div>
          </div>
        </div>
        <div class="prog-label"><span>verdict distribution</span></div>
        <div class="verdict-bar">
          <div class="verdict-seg" style="width:${gW}%;background:var(--good)"></div>
          <div class="verdict-seg" style="width:${goW}%;background:var(--ok)"></div>
          <div class="verdict-seg" style="width:${pW}%;background:var(--warn)"></div>
          <div class="verdict-seg" style="width:${lW}%;background:var(--bad)"></div>
        </div>
      `;

      const f = document.getElementById("filters");
      f.style.display = "flex";
      const filterBtns = document.querySelectorAll(".filter-btn");
      filterBtns[0].textContent = `all ${results.length}`;
      filterBtns[1].textContent = `great fit ${counts.great}`;
      filterBtns[2].textContent = `good fit ${counts.good}`;
      filterBtns[3].textContent = `partial fit ${counts.partial}`;
      filterBtns[4].textContent = `limited fit ${counts.limited}`;
    }

    async function runBenchmark() {
      const runBtn = document.getElementById("runBtn");
      runBtn.disabled = true;
      runBtn.textContent = "loading...";
      document.getElementById("progress-wrap").style.display = "block";
      results = [];

      const grid = document.getElementById("grid");
      grid.innerHTML = PROGRAMS.map(() => `
        <div class="loading-card">
          <div class="loading-pulse w60"></div>
          <div class="loading-pulse w40"></div>
        </div>
      `).join("");

      for (let i = 0; i < PROGRAMS.length; i++) {
        await new Promise(r => setTimeout(r, 8));
        results.push(PROGRAMS[i]);
        setProgress(i + 1, PROGRAMS.length, PROGRAMS[i].name.substring(0, 60));
      }

      setProgress(100, 100, "all 100 programs loaded");
      document.getElementById("prog-text").textContent = "complete";
      document.getElementById("exportBtn").style.display = "inline-block";
      runBtn.disabled = false;
      runBtn.textContent = "reload";
      updateSummary();
      renderGrid();
    }

    function exportResults() {
      const blob = new Blob([JSON.stringify(results, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ivx-100-programs.json";
      a.click();
    }
  </script>
</body>
