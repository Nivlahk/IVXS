name: Publish Extension
on:
  push:
    branches: [ main ]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install vsce
        run: npm install -g @vscode/vsce
      - name: Publish
        run: vsce publish -p ${{ secrets.VSCE_PAT }}
        working-directory: './extension code'
